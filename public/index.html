<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zakovat bazasi</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Literata:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F5F0;--side:#ECEAE2;--ink:#1E2230;--mut:#6B6F7B;--acc:#D9961B;--line:#DDDAD0;--card:#fff;--bad:#B3392F;--ok:#16766A}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.65 Literata,Georgia,serif}
button,input,select,h1,h2,h3,.nv,.sb{font-family:"Bricolage Grotesque",system-ui,sans-serif}
button{cursor:pointer;border:0;background:none;color:inherit;font-size:15px}
.app{display:grid;grid-template-columns:280px 1fr;height:100vh;height:100dvh}
aside{background:var(--side);border-right:1px solid var(--line);overflow-y:auto;padding:18px 12px}
.brand{font:800 22px "Bricolage Grotesque",sans-serif;padding:4px 10px 18px;letter-spacing:-.01em}
.nv{display:flex;justify-content:space-between;width:100%;text-align:left;padding:10px 12px;border-radius:8px;font-weight:600;font-size:16px}
.nv:hover,.sb:hover{background:rgba(0,0,0,.05)}
.nv.on{background:var(--card);box-shadow:0 0 0 1px var(--line)}
.nv span,.sb span{color:var(--mut);font-weight:500;font-size:13px}
.sub{margin:2px 0 8px 14px;padding-left:8px;border-left:2px solid var(--line)}
.sb{display:flex;justify-content:space-between;width:100%;text-align:left;padding:7px 10px;border-radius:6px;font-size:15px}
.sb.on{background:rgba(217,150,27,.18);font-weight:600}
.sb.add{color:var(--mut)}
main{display:flex;flex-direction:column;min-width:0;height:100%}
.mbar{display:none;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center;gap:10px;font:700 18px "Bricolage Grotesque",sans-serif}
.mbar button{font-size:22px;padding:2px 8px}
#view{flex:1;overflow-y:auto;padding:30px 22px 20px}
.col{max-width:740px;margin:0 auto}
.ttl{font:800 clamp(24px,4vw,32px)/1.2 "Bricolage Grotesque",sans-serif;margin:0 0 18px}
.row{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 18px;margin-bottom:10px;font:inherit}
.row:hover{border-color:var(--acc)}
.row b{display:block;font:700 18px "Bricolage Grotesque",sans-serif}
.row small{color:var(--mut);font-size:14px}
.mut{color:var(--mut)}.err{color:var(--bad)}
.back{color:var(--mut);padding:4px 0;margin-bottom:10px;font-weight:600}
.back:hover{color:var(--ink)}
.art p{margin:0 0 1em}
.art img{max-width:100%;border-radius:10px;display:block;margin:12px 0 4px}
.cap{font-size:13px;color:var(--mut);margin-bottom:14px}
.cat{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);font:14px "Bricolage Grotesque",sans-serif}
.ev{padding-left:22px}.ev li{margin:9px 0}
.src{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);font-size:15px}
.src a{color:var(--ok);word-break:break-all}.src ul{padding-left:20px}
.del{color:var(--bad);padding:12px 0;font-size:14px}
.go{background:var(--ink);color:#fff;border-radius:10px;padding:12px 20px;font-weight:600}
.q{font:700 clamp(21px,3.5vw,26px)/1.3 "Bricolage Grotesque",sans-serif;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:10px;margin:10px 0;padding:13px 16px;font-size:17px;font-family:Literata,serif}
.opt.ok{border-color:var(--ok);background:#E2F3F0}.opt.no{border-color:var(--bad);background:#FBE9E7}
#composer{display:flex;gap:8px;max-width:740px;width:calc(100% - 28px);margin:0 auto 16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
#composer select{border:0;background:var(--side);border-radius:10px;padding:0 10px;font-size:14px}
#composer input{flex:1;border:0;outline:0;font-size:17px;padding:10px 6px;min-width:0;background:none;color:var(--ink)}
#composer button{background:var(--acc);color:#1E2230;border-radius:10px;padding:0 18px;font-weight:700}
#composer button:disabled{opacity:.6}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--bad);color:#fff;padding:10px 18px;border-radius:8px;display:none;max-width:90%;z-index:50}
#ov{display:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media(max-width:800px){
 .app{grid-template-columns:1fr}
 aside{position:fixed;inset:0 auto 0 0;width:84%;max-width:300px;transform:translateX(-100%);transition:transform .2s;z-index:20}
 body.sb aside{transform:none}
 body.sb #ov{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:10}
 .mbar{display:flex}
 #view{padding:20px 16px}
}
</style></head><body>
<div class="app">
<aside><div class="brand">Zakovat bazasi</div><nav id="nav"></nav></aside>
<main>
<div class="mbar"><button onclick="document.body.classList.add('sb')" aria-label="Menyu">☰</button>Zakovat bazasi</div>
<div id="view"></div>
<form id="composer" onsubmit="gen();return false">
<select id="type" onchange="ph()"><option value="article">Maqola</option><option value="year">Yil</option><option value="date">Sana</option></select>
<input id="term" autocomplete="off" placeholder="Atama yozing: Filadelfiya eksperimenti">
<button id="gbtn" type="submit">Tayyorlash</button>
</form>
</main></div>
<div id="ov" onclick="closeSb()"></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let db={items:[],cats:[]},tab="art",cat="all",cur=null,busy=false,qz=null,catsOpen=true,qmode=null,me=0,names={};

function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",6000)}
function closeSb(){document.body.classList.remove("sb")}
async function api(action,data={}){
  const r=await fetch("/api",{method:"POST",headers:{"x-key":localStorage.getItem("zk")||""},body:JSON.stringify({action,...data})});
  const d=await r.json().catch(()=>({error:"Server javob bermadi"}));
  if(r.status===401){const k=prompt("Kirish kalitini kiriting");if(k!==null){localStorage.setItem("zk",k);return api(action,data)}}
  if(!r.ok)throw new Error(d.error||"Xatolik");
  return d;
}
async function wikiImg(q){try{
  const u="https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrlimit=1&gsrsearch="+encodeURIComponent(q)+"&prop=pageimages&piprop=thumbnail&pithumbsize=900&format=json&origin=*";
  const d=await(await fetch(u)).json();return Object.values(d.query?.pages||{})[0]?.thumbnail?.source||null}catch{return null}}
const persist=()=>api("save",{db}).catch(e=>toast("Saqlanmadi: "+e.message));
function ph(){$("#term").placeholder={article:"Atama yozing: Filadelfiya eksperimenti",year:"Yilni yozing: 1969",date:"Sanani yozing: 20-iyul"}[$("#type").value]}

async function gen(){
  const term=$("#term").value.trim(),type=$("#type").value;if(!term||busy)return;
  busy=true;$("#gbtn").textContent="Tayyorlanmoqda…";$("#gbtn").disabled=true;
  try{
    const it=await api("generate",{term,type,cats:db.cats});
    it.id=Date.now().toString(36);it.type=type;it.by=me;
    if(it.image_query&&it.image_query!=="null")it.img=await wikiImg(it.image_query);
    db.items.unshift(it);await persist();$("#term").value="";
    tab=type==="article"?"art":type;cat="all";cur=it.id;closeSb();
  }catch(e){toast(e.message)}
  busy=false;$("#gbtn").textContent="Tayyorlash";$("#gbtn").disabled=false;render();
}

function go(t){
  if(t==="art")catsOpen=!(tab==="art"&&catsOpen&&cat==="all"&&!cur);
  tab=t;cat="all";cur=null;if(t==="quiz"){qmode=null;qz=null}if(t!=="art"&&t!=="quiz")closeSb();render();
}
function setCat(c){tab="art";cat=c;cur=null;closeSb();render()}
function openItem(id){cur=id;render()}
function addCat(){const n=prompt("Yangi toifa nomi");if(n&&n.trim()&&!db.cats.includes(n.trim())){db.cats.push(n.trim());persist();render()}}
function chCat(id,c){const it=db.items.find(x=>x.id===id);if(it.by!==me){toast("Bu boshqa foydalanuvchining maqolasi, uni o'zgartirib bo'lmaydi");render();return}it.cat=c;persist()}
function delItem(id){const it=db.items.find(x=>x.id===id);if(it&&it.by!==me){toast("Bu boshqa foydalanuvchining yozuvi, uni o'chirib bo'lmaydi");return}if(confirm("O'chirilsinmi?")){db.items=db.items.filter(x=>x.id!==id);cur=null;persist();render()}}

function render(){$("#nav").innerHTML=navHtml();const v=$("#view");v.innerHTML='<div class="col">'+viewHtml()+'</div>';v.scrollTop=0}
function navHtml(){
  const arts=db.items.filter(i=>i.type==="article"),n=t=>db.items.filter(i=>i.type===t).length;
  const nv=(t,l,c)=>`<button class="nv ${tab===t?"on":""}" onclick="go('${t}')">${l}${c===undefined?"":`<span>${c}</span>`}</button>`;
  const rows=[["all","Barchasi",arts.length],...db.cats.map(c=>[c,c,arts.filter(i=>i.cat===c).length])];
  const sub=tab==="art"&&catsOpen?`<div class="sub">${rows.map(([k,l,c])=>`<button class="sb ${cat===k?"on":""}" data-c="${esc(k)}" onclick="setCat(this.dataset.c)">${esc(l)}<span>${c}</span></button>`).join("")}<button class="sb add" onclick="addCat()">+ toifa qo'shish</button></div>`:"";
  const qs=tab==="quiz"?`<div class="sub">${[["article","Maqolalar bo'yicha"],["year","Yillar bo'yicha"],["date","Sanalar bo'yicha"]].map(([k,l])=>`<button class="sb ${qmode===k?"on":""}" onclick="setQ('${k}')">${l}<span>${n(k)}</span></button>`).join("")}</div>`:"";return nv("art","Maqolalar",arts.length)+sub+nv("year","Yillar",n("year"))+nv("date","Sanalar",n("date"))+nv("quiz","Test")+qs;
}
function viewHtml(){
  if(tab==="quiz")return quizView();
  if(tab==="art")return cur?reader():list();
  return cur?eventsView():timeline();
}
function list(){
  const shown=db.items.filter(i=>i.type==="article"&&(cat==="all"||i.cat===cat));
  return `<h2 class="ttl">${cat==="all"?"Barcha maqolalar":esc(cat)}</h2>`+(shown.map(i=>`<button class="row" onclick="openItem('${i.id}')"><b>${esc(i.title)}</b><small>${esc(i.cat)} · ${esc(names[i.by]||"")}</small></button>`).join("")||`<p class="mut">Bu yerda hali maqola yo'q. Pastdagi maydonga atama yozing.</p>`);
}
function srcs(i){return i.sources?.length?`<div class="src"><b>Manbalar</b><ul>${i.sources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title||s.url)}</a></li>`).join("")}</ul><small class="mut">Muhim yil va sonlarni o'zingiz tekshirib oling.</small></div>`:""}
function reader(){
  const i=db.items.find(x=>x.id===cur);if(!i)return list();
  return `<div class="art"><button class="back" onclick="openItem(null)">← ${cat==="all"?"Maqolalar":esc(cat)}</button>
  <h2 class="ttl">${esc(i.title)}</h2>
  <select class="cat" onchange="chCat('${i.id}',this.value)">${db.cats.map(c=>`<option ${c===i.cat?"selected":""}>${esc(c)}</option>`).join("")}</select>
  ${i.img?`<img src="${esc(i.img)}" alt="${esc(i.title)}"><div class="cap">Rasm: Wikipedia</div>`:""}
  <div style="margin-top:14px">${(i.body||"").split(/\n\n+/).map(p=>`<p>${esc(p)}</p>`).join("")}</div>${srcs(i)}
  <button class="del" onclick="delItem('${i.id}')">Maqolani o'chirish</button></div>`;
}
function timeline(){
  const arr=db.items.filter(i=>i.type===tab).sort((a,b)=>(a.sort||0)-(b.sort||0));
  const name=tab==="year"?"Yillar":"Sanalar";
  return `<h2 class="ttl">${name}</h2>`+(arr.map(i=>`<button class="row" onclick="openItem('${i.id}')"><b>${esc(i.title)}</b><small>${(i.events||[]).length} ta voqea · ${esc(names[i.by]||"")}</small></button>`).join("")||`<p class="mut">Hali qo'shilmagan. Pastdagi maydonda turini "${tab==="year"?"Yil":"Sana"}" qilib tanlang va ${tab==="year"?"1969":"20-iyul"} deb yozing.</p>`);
}
function eventsView(){
  const i=db.items.find(x=>x.id===cur);if(!i)return timeline();
  return `<button class="back" onclick="openItem(null)">← ${tab==="year"?"Yillar":"Sanalar"}</button><h2 class="ttl">${esc(i.title)}</h2>
  <ol class="ev">${(i.events||[]).map(e=>`<li>${esc(e)}</li>`).join("")}</ol>${srcs(i)}
  <button class="del" onclick="delItem('${i.id}')">O'chirish</button>`;
}
function quizView(){
  const h=`<h2 class="ttl">Test${qmode?": "+({article:"maqolalar",year:"yillar",date:"sanalar"})[qmode]+" bo'yicha":""}</h2>`;
  if(!qmode)return h+`<p class="mut">Chap paneldan tanlang: maqolalar, yillar yoki sanalar bo'yicha test.</p>`;if(!qpool().length)return h+`<p class="mut">Bu bo'limda hali yozuv yo'q. Avval pastdagi maydondan qo'shing.</p>`;
  if(!qz)return h+`<p class="mut">Saqlangan yozuvlaringizdan tasodifiy savol beriladi.</p><button class="go" onclick="nextQ()">Testni boshlash</button>`;
  if(qz.loading)return h+`<p class="mut">Savol tayyorlanmoqda…</p>`;
  if(qz.error)return h+`<p class="err">Xato: ${esc(qz.error)}</p><button class="go" onclick="nextQ()">Qayta urinish</button>`;
  const done=qz.picked!==undefined;
  return h+`<p class="q">${esc(qz.q)}</p>`+qz.options.map((o,k)=>`<button class="opt ${done?(k===qz.answer?"ok":k===qz.picked?"no":""):""}" ${done?"disabled":""} onclick="pick(${k})">${esc(o)}</button>`).join("")+
   (done?`<p>${esc(qz.explain||"")}</p><button class="go" onclick="nextQ()">Keyingi savol</button>`:"");
}
function pick(k){qz.picked=k;render()}
const qpool=()=>db.items.filter(i=>i.type===qmode);
function setQ(m){tab="quiz";qmode=m;qz=null;closeSb();nextQ()}
async function nextQ(){
  const pl=qpool();if(!pl.length){render();return}const it=pl[Math.random()*pl.length|0];
  qz={loading:true};render();
  try{
    const r=await api("quiz",{text:`${it.title}. ${it.body||""} ${(it.events||[]).join(" ")}`});
    if(!Array.isArray(r.options)||r.options.length<2||typeof r.answer!=="number")throw new Error("AI noto'g'ri formatda javob berdi, qayta urinib ko'ring");
    qz=r;
  }catch(e){qz={error:e.message}}
  render();
}
(async()=>{try{const d=await api("load");db={items:d.items,cats:d.cats};me=d.me;names=d.names||{}}catch(e){toast(e.message)}render()})();
</script></body></html>
