<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zakovat bazasi</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Literata:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#E9EDF2;--ink:#101B33;--mut:#5B6779;--acc:#F2B632;--teal:#16766A;--line:#C9D1DC;--card:#fff;--bad:#B3392F}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 Literata,Georgia,serif}
h1,h2,h3,button,input,select,.chip{font-family:"Bricolage Grotesque",system-ui,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:28px 18px 80px}
.top{background:var(--ink);color:#fff;padding:34px 18px 30px}
.top .wrap{padding:0 18px}
.top h1{margin:0 0 14px;font-size:clamp(28px,6vw,44px);font-weight:800;letter-spacing:-.02em}
.gen{display:flex;gap:8px;flex-wrap:wrap}
.gen input{flex:1 1 260px;font-size:22px;padding:14px 16px;border:3px solid var(--acc);border-radius:6px;background:#fff;color:var(--ink)}
.gen select{padding:0 12px;border-radius:6px;border:0;font-size:16px}
button{cursor:pointer;border:0;border-radius:6px;font-size:16px;font-weight:600;padding:12px 18px}
.go{background:var(--acc);color:var(--ink)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tabs button{background:none;border-radius:0;padding:12px 16px;color:var(--mut);border-bottom:4px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--ink);border-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.chip{background:#fff;border:1px solid var(--line);padding:6px 14px;border-radius:99px;font-size:15px;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.item{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--teal);padding:14px 18px;margin-bottom:10px;border-radius:4px;font:inherit;color:inherit}
.item b{font:700 20px "Bricolage Grotesque",sans-serif;display:block}
.item small{color:var(--mut)}
.art h2{font-size:clamp(26px,5vw,38px);margin:6px 0 10px;line-height:1.15}
.art img{max-width:100%;border-radius:4px;display:block;margin:14px 0 4px}
.cap{font-size:13px;color:var(--mut);margin-bottom:14px}
.src{margin-top:26px;padding-top:14px;border-top:2px solid var(--line);font-size:15px}
.src a{color:var(--teal);word-break:break-all}
.ghost{background:none;color:var(--mut);padding:8px 0}
.del{background:none;color:var(--bad);padding:8px 0}
details{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:12px 18px;margin-bottom:10px}
summary{cursor:pointer;font:700 20px "Bricolage Grotesque",sans-serif}
li{margin:8px 0}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);margin:10px 0;padding:14px 16px;font-size:17px}
.opt.ok{border-color:var(--teal);background:#E2F3F0}.opt.no{border-color:var(--bad);background:#FBE9E7}
.q{font:700 clamp(22px,4vw,28px)/1.3 "Bricolage Grotesque",sans-serif;margin:0 0 12px}
.empty{color:var(--mut);padding:30px 0}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--bad);color:#fff;padding:10px 18px;border-radius:6px;display:none;max-width:90%}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style></head><body>
<div class="top"><div class="wrap">
<h1>Zakovat bazasi</h1>
<div class="gen">
<input id="term" placeholder="Atama yozing: Filadelfiya eksperimenti" autocomplete="off">
<select id="type"><option value="article">Maqola</option><option value="year">Yil</option><option value="date">Sana</option></select>
<button class="go" id="gbtn">Tayyorlash</button></div>
</div></div>
<div class="wrap">
<div class="tabs" id="tabs"></div>
<div id="main"></div>
</div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let db={items:[],cats:[]},tab="art",cat="all",open=null,busy=false,qz=null;

function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",5000)}
async function api(action,data={}){
  const r=await fetch("/.netlify/functions/api",{method:"POST",headers:{"x-key":localStorage.getItem("zk")||""},body:JSON.stringify({action,...data})});
  const d=await r.json().catch(()=>({error:"Server javob bermadi (vaqt tugagan bo'lishi mumkin)"}));
  if(r.status===401){const k=prompt("Kirish kalitini kiriting");if(k!==null){localStorage.setItem("zk",k);return api(action,data)}}
  if(!r.ok)throw new Error(d.error||"Xatolik");
  return d;
}
async function wikiImg(q){try{
  const u="https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrlimit=1&gsrsearch="+encodeURIComponent(q)+"&prop=pageimages&piprop=thumbnail&pithumbsize=900&format=json&origin=*";
  const d=await(await fetch(u)).json();return Object.values(d.query?.pages||{})[0]?.thumbnail?.source||null}catch{return null}}
const persist=()=>api("save",{db}).catch(e=>toast("Saqlanmadi: "+e.message));

async function gen(){
  const term=$("#term").value.trim(),type=$("#type").value;if(!term||busy)return;
  busy=true;$("#gbtn").textContent="Tayyorlanmoqda…";$("#gbtn").disabled=true;
  try{
    const it=await api("generate",{term,type,cats:db.cats});
    it.id=Date.now().toString(36);it.type=type;
    if(it.image_query&&it.image_query!=="null")it.img=await wikiImg(it.image_query);
    db.items.unshift(it);await persist();$("#term").value="";
    tab=type==="article"?"art":type;open=type==="article"?it.id:null;
  }catch(e){toast(e.message)}
  busy=false;$("#gbtn").textContent="Tayyorlash";$("#gbtn").disabled=false;render();
}
$("#gbtn").onclick=gen;$("#term").onkeydown=e=>{if(e.key==="Enter")gen()};

function setTab(t){tab=t;open=null;render()}
function render(){
  $("#tabs").innerHTML=[["art","Maqolalar"],["year","Yillar"],["date","Sanalar"],["quiz","Test"]]
    .map(([k,l])=>`<button class="${tab===k?"on":""}" onclick="setTab('${k}')">${l}</button>`).join("");
  const m=$("#main");
  if(tab==="art")m.innerHTML=open?reader():list();
  else if(tab==="quiz")m.innerHTML=quiz();
  else m.innerHTML=timeline(tab);
}
function list(){
  const arts=db.items.filter(i=>i.type==="article");
  const cnt=c=>arts.filter(i=>i.cat===c).length;
  const chips=`<div class="chips"><span class="chip ${cat==="all"?"on":""}" onclick="cat='all';render()">Barchasi (${arts.length})</span>`+
    db.cats.map(c=>`<span class="chip ${cat===c?"on":""}" onclick="cat='${esc(c)}';render()">${esc(c)} (${cnt(c)})</span>`).join("")+
    `<span class="chip" onclick="addCat()">+ toifa</span></div>`;
  const shown=arts.filter(i=>cat==="all"||i.cat===cat);
  return chips+(shown.map(i=>`<button class="item" onclick="open='${i.id}';render()"><b>${esc(i.title)}</b><small>${esc(i.cat)}</small></button>`).join("")||`<div class="empty">Bu toifada hali maqola yo'q. Yuqoridan atama yozing.</div>`);
}
function addCat(){const n=prompt("Yangi toifa nomi");if(n&&n.trim()&&!db.cats.includes(n.trim())){db.cats.push(n.trim());persist();render()}}
function srcs(i){return i.sources?.length?`<div class="src"><b>Manbalar</b><ul>${i.sources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title||s.url)}</a></li>`).join("")}</ul><small>Havolalarni ishlatishdan oldin o'zingiz tekshirib oling.</small></div>`:""}
function reader(){
  const i=db.items.find(x=>x.id===open);if(!i)return list();
  return `<div class="art"><button class="ghost" onclick="open=null;render()">← Ro'yxatga qaytish</button>
  <select onchange="chCat('${i.id}',this.value)">${db.cats.map(c=>`<option ${c===i.cat?"selected":""}>${esc(c)}</option>`).join("")}</select>
  <h2>${esc(i.title)}</h2>
  ${i.img?`<img src="${esc(i.img)}" alt="${esc(i.title)}"><div class="cap">Rasm: Wikipedia</div>`:""}
  ${i.body.split(/\n\n+/).map(p=>`<p>${esc(p)}</p>`).join("")}${srcs(i)}
  <button class="del" onclick="delItem('${i.id}')">O'chirish</button></div>`;
}
function chCat(id,c){db.items.find(x=>x.id===id).cat=c;persist()}
function delItem(id){if(confirm("O'chirilsinmi?")){db.items=db.items.filter(x=>x.id!==id);open=null;persist();render()}}
function timeline(t){
  const arr=db.items.filter(i=>i.type===t).sort((a,b)=>(a.sort||0)-(b.sort||0));
  if(!arr.length)return `<div class="empty">Hali ${t==="year"?"yil":"sana"} qo'shilmagan. Yuqorida turini "${t==="year"?"Yil":"Sana"}" qilib tanlang va ${t==="year"?"1969":"20-iyul"} deb yozing.</div>`;
  return arr.map(i=>`<details><summary>${esc(i.title)}</summary><ul>${i.events.map(e=>`<li>${esc(e)}</li>`).join("")}</ul>${srcs(i)}<button class="del" onclick="delItem('${i.id}')">O'chirish</button></details>`).join("");
}
function quiz(){
  if(!db.items.length)return `<div class="empty">Test uchun avval kamida bitta maqola, yil yoki sana qo'shing.</div>`;
  if(!qz)return `<button class="go" onclick="nextQ()">Testni boshlash</button>`;
  if(qz.loading)return `<div class="empty">Savol tayyorlanmoqda…</div>`;
  const done=qz.picked!==undefined;
  return `<p class="q">${esc(qz.q)}</p>`+qz.options.map((o,k)=>`<button class="opt ${done?(k===qz.answer?"ok":k===qz.picked?"no":""):""}" ${done?"disabled":""} onclick="pick(${k})">${esc(o)}</button>`).join("")+
   (done?`<p>${esc(qz.explain)}</p><button class="go" onclick="nextQ()">Keyingi savol</button>`:"");
}
function pick(k){qz.picked=k;render()}
async function nextQ(){
  const it=db.items[Math.random()*db.items.length|0];
  qz={loading:true};render();
  try{qz=await api("quiz",{text:`${it.title}. ${it.body||""} ${(it.events||[]).join(" ")}`})}catch(e){toast(e.message);qz=null}
  render();
}
(async()=>{try{db=await api("load")}catch(e){toast(e.message)}render()})();
</script></body></html>
